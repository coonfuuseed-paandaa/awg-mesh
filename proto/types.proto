syntax = "proto3";

package awgmesh;

option go_package = "github.com/coonfuuseed-paandaa/awg-mesh/proto";

message Empty {}

// AWG obfuscation parameters.
message AwgParams {
  int32 jc = 1;
  int32 jmin = 2;
  int32 jmax = 3;
  int32 s1 = 4;
  int32 s2 = 5;
  int32 s3 = 6;
  int32 s4 = 7;
  int32 h1 = 8;
  int32 h2 = 9;
  int32 h3 = 10;
  int32 h4 = 11;
  string i1 = 12;
  string i2 = 13;
  string i3 = 14;
  string i4 = 15;
  string i5 = 16;
}

// Onboarding

message NodeConfig {
  string name = 1;
  string mode = 2;
  string overlay_ip = 3;
  int32 listen_port = 4;
  repeated PeerSpec peers = 5;
}

message PeerSpec {
  string name = 1;
  string endpoint_host = 2;
  string overlay_ip = 3;
  bytes public_key = 4;
  bytes preshared_key = 5;
  repeated string allowed_ips = 6;
  AwgParams params = 7;
}

message InitRequest {
  bytes ca_cert = 1;
  bytes node_cert = 2;
  bytes node_key = 3;
  NodeConfig config = 4;
}

message InitResponse {
  bool success = 1;
  bytes node_public_key = 2;
  string message = 3;
}

message RotateTokenRequest {
  string new_token_hash = 1;
}

message RotateTokenResponse {
  bool success = 1;
}

// Tunnel management (master mode)

message AddTunnelRequest {
  string name = 1;
  string endpoint_host = 2;
  string overlay_ip = 3;
  string balancer_ip = 4;
  bytes peer_public_key = 5;
  bytes preshared_key = 6;
  AwgParams params = 7;
  int32 weight = 8;
  bool backup = 9;
  string transport_subnet = 10;
  string master_transport_ip = 11;
  string endpoint_transport_ip = 12;
}

message AddTunnelResponse {
  bool success = 1;
  bytes master_public_key = 2;
  string interface_name = 3;
  int32 listen_port = 4;
}

message RemoveTunnelRequest {
  string name = 1;
}

message RemoveTunnelResponse {
  bool success = 1;
}

message UpdateTunnelPeerRequest {
  string name = 1;              // existing tunnel name (e.g. endpoint name "us-01")
  bytes peer_public_key = 2;    // new pubkey (required, 32 bytes)
  string balancer_ip = 3;       // optional — refresh ECMP mapping
  repeated string allowed_ips = 4;  // optional — if non-empty, replace; else keep
}

message UpdateTunnelPeerResponse {
  bool success = 1;
  bytes master_public_key = 2;  // echo back for caller verification
  bool unchanged = 3;           // true when the new key matches existing (idempotent no-op)
}

message TunnelList {
  repeated TunnelStatus tunnels = 1;
}

// Peer management (endpoint mode)

message AddPeerRequest {
  bytes public_key = 1;
  bytes preshared_key = 2;
  repeated string allowed_ips = 3;
  AwgParams params = 4;
  string endpoint_host = 5;
  int32 persistent_keepalive = 6;
  string transport_subnet = 7;
  string local_transport_ip = 8;
  string peer_transport_ip = 9;
  string balancer_ip = 10;
  string peer_name = 11;  // master name (on endpoint side) or endpoint name (on master side); used for per-iface routing
}

message AddPeerResponse {
  bool success = 1;
}

message RemovePeerRequest {
  bytes public_key = 1;
}

message RemovePeerResponse {
  bool success = 1;
}

message PeerList {
  repeated PeerStatus peers = 1;
}

message PeerStatus {
  bytes public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  int64 last_handshake = 4;
  int64 tx_bytes = 5;
  int64 rx_bytes = 6;
}

// Rotation

message RotateParamsRequest {
  string tunnel_name = 1;
  int32 tier = 2;
  AwgParams new_params = 3;
  bytes new_public_key = 4;
}

message RotateParamsResponse {
  bool success = 1;
  string message = 2;
}

message GetParamsRequest {
  string tunnel_name = 1;
}

// Keypair rotation (endpoint mode only).

message RotateKeypairRequest {
  bytes  private_key  = 1;  // 32 raw bytes; endpoint persists + rebinds
  string tunnel_name  = 2;  // identifies which endpoint interface to rebind
}

message RotateKeypairResponse {
  bytes  new_public_key = 1;  // derived from private_key, returned for CLI verification
}

// Capture

message CaptureRequest {
  repeated string domains = 1;
  int32 count_per_domain = 2;
  string schedule = 3;           // cron expression or duration (e.g. "0 3 * * *" or "24h")
  int32 retention_days = 4;      // how long to keep capture data (0 = no cleanup)
}

message CaptureResponse {
  bool success = 1;
  int32 captured_count = 2;
}

// Status

message NodeStatus {
  string name = 1;
  string mode = 2;
  string overlay_ip = 3;
  repeated TunnelStatus tunnels = 4;
  string uptime = 5;
}

message TunnelStatus {
  string name = 1;
  string overlay_ip = 2;
  bool healthy = 3;
  int64 last_handshake = 4;
  int64 tx_bytes = 5;
  int64 rx_bytes = 6;
  string last_rotation = 7;
}

message RouteTable {
  repeated RouteEntry routes = 1;
}

message RouteEntry {
  string destination = 1;
  string via_interface = 2;
  string via_overlay_ip = 3;
  int32 weight = 4;
  bool active = 5;
}

message HealthResponse {
  bool healthy = 1;
  repeated TunnelHealth tunnel_health = 2;
}

message TunnelHealth {
  string name = 1;
  bool healthy = 2;
  int64 last_check_ms = 3;
  int32 consecutive_failures = 4;
}

// GetTransportState — read-only node state dump for mesh-ctl inspect (v1.10.1).
// Returns the node's in-memory peer state: configured overlay IP, per-peer
// public keys, and allowed IPs. No private keys or PSKs are included.
// Pre-v1.10.1 nodes return codes.Unimplemented.

message TransportPeerState {
  string name = 1;             // peer name (endpoint or master name)
  string public_key_hex = 2;   // runtime public key (from live wg/tunnel state)
  repeated string allowed_ips = 3;  // runtime allowed IP CIDRs (from live peer manager)
  int64 last_handshake_unix = 4;    // Unix timestamp of last WireGuard handshake (0 = never)
  string disk_public_key_hex = 5;   // disk public key (from transport.yml); empty = same as runtime or unknown
  repeated string disk_allowed_ips = 6; // disk allowed IPs (from transport.yml); empty = same as runtime
}

message TransportStateResponse {
  string node_name = 1;
  string mode = 2;
  string overlay_ip = 3;
  repeated TransportPeerState peers = 4;
}
