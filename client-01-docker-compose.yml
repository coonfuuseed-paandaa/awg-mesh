services:
  awg-mesh-node:
    image: ghcr.io/coonfuuseed-paandaa/awg-mesh:latest
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      - MESH_TOKEN=f5f2a95dfce2fb0abafc2187b7c31d603af253151dde87a2837564a4f3fbd421
      - MESH_MODE=client
      - MESH_OVERLAY_IP=172.20.70.131
      - MESH_MASTERS=ru-01,ru-02
    volumes:
      - /etc/awg-mesh:/etc/awg-mesh
      - /var/lib/awg-mesh:/var/lib/awg-mesh