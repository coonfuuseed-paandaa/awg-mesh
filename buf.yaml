version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The v2.0.0 release keeps the existing flat proto source layout and
    # generated Go package names stable. Tightening these rules requires a
    # separate breaking API migration.
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
