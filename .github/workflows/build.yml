name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Run Tests
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 30" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 30% threshold"
            exit 1
          fi

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build Binaries
        run: CGO_ENABLED=1 go build -trimpath -o bin/awg-mesh-node ./cmd/awg-mesh-node && CGO_ENABLED=1 go build -trimpath -o bin/mesh-ctl ./cmd/mesh-ctl

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bin
          path: bin/

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -f deploy/Dockerfile --build-arg VERSION=${{ github.sha }} -t awg-mesh-node:ci .

      - name: Smoke Test
        run: |
          docker run --rm --privileged --entrypoint sh awg-mesh-node:ci -c '
            echo test > /config/mesh.token &&
            timeout 5 /usr/local/bin/awg-mesh-node --mode endpoint --name ci-test --overlay-ip 10.0.0.99 2>&1 || true
          ' | tee /tmp/smoke.log
          grep -q "endpoint interface created" /tmp/smoke.log || (echo "::error::Smoke test failed — no AWG interface created" && exit 1)
          grep -q "gRPC server listening" /tmp/smoke.log || (echo "::error::Smoke test failed — no gRPC server" && exit 1)
          echo "Smoke test passed"

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag awg-mesh-node:ci ghcr.io/coonfuuseed-paandaa/awg-mesh:latest
          docker tag awg-mesh-node:ci ghcr.io/coonfuuseed-paandaa/awg-mesh:${{ github.sha }}
          docker push ghcr.io/coonfuuseed-paandaa/awg-mesh:latest
          docker push ghcr.io/coonfuuseed-paandaa/awg-mesh:${{ github.sha }}

      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker tag awg-mesh-node:ci ${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh:latest
          docker tag awg-mesh-node:ci ${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh:${{ github.sha }}
    permissions:
      contents: read
      packages: write
