name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Uses the `toolchain` directive in go.mod so vuln-patched Go ships
          # with the code. Bump go.mod (not this file) when the stdlib needs
          # to move.
          go-version-file: go.mod
          check-latest: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Uses the `toolchain` directive in go.mod so vuln-patched Go ships
          # with the code. Bump go.mod (not this file) when the stdlib needs
          # to move.
          go-version-file: go.mod
          check-latest: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Run Tests
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Privileged Tests
        run: |
          sudo CGO_ENABLED=1 $(which go) test -race -coverprofile=coverage-priv.out -covermode=atomic \
            -timeout 120s ./pkg/routing/ -v -count=1

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Merge Coverage Profiles
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage.out coverage-priv.out > coverage-merged.out

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage-merged.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 30" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 30% threshold"
            exit 1
          fi

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage-merged.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Uses the `toolchain` directive in go.mod so vuln-patched Go ships
          # with the code. Bump go.mod (not this file) when the stdlib needs
          # to move.
          go-version-file: go.mod
          check-latest: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build Binaries
        run: CGO_ENABLED=1 go build -trimpath -o bin/awg-mesh-node ./cmd/awg-mesh-node && CGO_ENABLED=1 go build -trimpath -o bin/mesh-ctl ./cmd/mesh-ctl

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bin
          path: bin/

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    # Multi-arch images: MikroTik (arm64), Raspberry Pi (arm/v7), servers (amd64)
    # all pull from the same manifest list. Without this the client image is
    # unusable on non-amd64 hardware — see field report bug 13.
    strategy:
      matrix:
        include:
          - image: node
            dockerfile: deploy/Dockerfile.node
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - image: client
            dockerfile: deploy/Dockerfile.client
            platforms: linux/amd64,linux/arm64,linux/arm/v7
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Build amd64-only first so the smoke test has a local image to exercise.
      # --load can only import a single platform; the multi-arch push below
      # reuses the buildx cache, so the total added cost is small.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: awg-mesh-${{ matrix.image }}:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke Test (node only)
        if: matrix.image == 'node'
        run: |
          docker run --rm --privileged --entrypoint sh awg-mesh-node:ci -c '
            echo test > /config/mesh.token &&
            timeout 5 /usr/local/bin/awg-mesh-node --mode endpoint --name ci-test --overlay-ip 10.0.0.99 2>&1 || true
          ' | tee /tmp/smoke.log
          grep -q "endpoint interface created" /tmp/smoke.log || (echo "::error::Smoke test failed — no AWG interface created" && exit 1)
          grep -q "gRPC server listening" /tmp/smoke.log || (echo "::error::Smoke test failed — no gRPC server" && exit 1)
          echo "Smoke test passed"

      - name: Smoke Test (client only)
        if: matrix.image == 'client'
        run: |
          docker run --rm --privileged --entrypoint sh awg-mesh-client:ci -c '
            echo test > /config/mesh.token &&
            timeout 5 /usr/local/bin/awg-mesh-node --mode client --name ci-client --overlay-ip 10.0.0.200 2>&1 || true
          ' | tee /tmp/smoke-client.log
          grep -q "gRPC server listening" /tmp/smoke-client.log || (echo "::error::Client smoke test failed — no gRPC server" && exit 1)
          echo "Client smoke test passed"

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push (multi-arch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/coonfuuseed-paandaa/awg-mesh-${{ matrix.image }}:latest
            ghcr.io/coonfuuseed-paandaa/awg-mesh-${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh-${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Historical alias: some operators hard-coded ghcr.io/.../awg-mesh (no
      # -node suffix) before the multi-image split. Keep it working.
      - name: Build and Push awg-mesh alias (node only)
        if: matrix.image == 'node' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/coonfuuseed-paandaa/awg-mesh:latest
            ghcr.io/coonfuuseed-paandaa/awg-mesh:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Verify published manifest lists advertise the arm64 and arm/v7
      # platforms. Catches future regressions where a config change silently
      # falls back to amd64-only.
      - name: Verify multi-arch manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          MANIFEST=$(docker buildx imagetools inspect ghcr.io/coonfuuseed-paandaa/awg-mesh-${{ matrix.image }}:${{ github.sha }})
          echo "$MANIFEST"
          echo "$MANIFEST" | grep -q "linux/amd64"  || (echo "::error::manifest missing linux/amd64"  && exit 1)
          echo "$MANIFEST" | grep -q "linux/arm64"  || (echo "::error::manifest missing linux/arm64"  && exit 1)
          echo "$MANIFEST" | grep -q "linux/arm/v7" || (echo "::error::manifest missing linux/arm/v7" && exit 1)
