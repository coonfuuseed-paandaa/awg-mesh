name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      retag_version:
        description: 'Retag existing image (e.g. v1.8.0). Leave empty for normal build.'
        required: false
        default: ''
        type: string
      source_sha:
        description: 'Commit SHA tag to retag from (40-char lowercase hex, e.g. 15990ae5e03cc83089ed5f05d0a31228dceb223c). Required when retag_version is set.'
        required: false
        default: ''
        type: string

# Supply-chain hardening: every `uses:` is pinned by commit SHA, not a
# mutable major-version tag. Tag-movement attacks against an upstream
# action can't reach this pipeline unless the actual commit history is
# rewritten. Dependabot (.github/dependabot.yml) bumps SHAs back to
# current major-version tips on a monthly schedule; the `# vN` comment
# after each SHA tells Dependabot which stream to follow.
jobs:
  lint:
    # Build matrix skips for retag-only dispatches; retag job alone publishes.
    if: github.event_name != 'workflow_dispatch' || inputs.retag_version == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          # Uses the `toolchain` directive in go.mod so vuln-patched Go ships
          # with the code. Bump go.mod (not this file) when the stdlib needs
          # to move.
          go-version-file: go.mod
          check-latest: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: grep-token-leak
        run: make grep-token-leak

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.11.4
          args: ./...

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.retag_version == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          # Uses the `toolchain` directive in go.mod so vuln-patched Go ships
          # with the code. Bump go.mod (not this file) when the stdlib needs
          # to move.
          go-version-file: go.mod
          check-latest: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Run Tests
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Privileged Tests
        run: |
          sudo CGO_ENABLED=1 $(which go) test -race -coverprofile=coverage-priv.out -covermode=atomic \
            -timeout 120s ./pkg/routing/ -v -count=1

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Merge Coverage Profiles
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage.out coverage-priv.out > coverage-merged.out

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage-merged.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 30" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 30% threshold"
            exit 1
          fi

      - name: Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage-merged.out

  windows-compile:
    # Cross-compile mesh-ctl for Windows (amd64 + arm64) on a Linux runner.
    # No Windows runner needed — compile-only check catches build-tag errors
    # that would otherwise be invisible in Linux CI (NFR-3).
    if: github.event_name != 'workflow_dispatch' || inputs.retag_version == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Cross-compile mesh-ctl for Windows amd64
        run: GOOS=windows GOARCH=amd64 go build ./cmd/mesh-ctl

      - name: Cross-compile mesh-ctl for Windows arm64
        run: GOOS=windows GOARCH=arm64 go build ./cmd/mesh-ctl

  chr-lint:
    # CHR (Cloud Hosted Router) import-lint: boots an ephemeral RouterOS x86_64
    # CHR via QEMU usermode networking, uploads the golden .rsc fixture, runs
    # /import on it, fails on non-zero RouterOS exit. Catches regressions in
    # generator output that would only manifest on a real RouterOS device.
    #
    # CHR_VERSION pinned to a stable 7.x release. Bump in lockstep with the
    # cache key so a new CHR forces fresh download. Cache miss adds ~50 MB
    # download (~30 s); cache hit ~5 s.
    #
    # Cost bound (NFR-3): ≤ 90 s total with cache hit; path filter restricts
    # to PRs that touch generator-relevant code only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Experimental gate: CHR boots reliably locally but exhibits sshd-readiness
    # race in GitHub Actions environment (TIMEOUT-AT-LOGIN despite SSH port open).
    # Soft-failure until boot-detection logic stabilises. Real RouterOS coverage
    # is provided by tests/simulation/mikrotik-chr-e2e.sh on operator hardware.
    continue-on-error: true
    env:
      # v1.14.0 onboarding bundle targets RouterOS 7.21.x as the canonical
      # tier (mountlists=, remote-image=, /container/mounts list= syntax).
      # The lint gate MUST exercise the canonical tier — running it against
      # 7.16 would only validate the legacy syntax path that the v1.14.0
      # generator no longer emits, masking 7.21+ regressions. See
      # docs/MIKROTIK-VERSION-COMPAT.md §1 for the support tier table.
      CHR_VERSION: 7.21.3
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Detect generator-relevant changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            mikrotik:
              - 'pkg/mikrotik/**'
              - 'pkg/topology/**'
              - 'cmd/mesh-ctl/**'

      - name: Skip if no generator changes
        if: steps.filter.outputs.mikrotik != 'true'
        run: |
          echo "No changes to pkg/mikrotik/, pkg/topology/, or cmd/mesh-ctl/ — skipping CHR import lint."
          exit 0

      - name: Install QEMU + tools
        if: steps.filter.outputs.mikrotik == 'true'
        # `expect` is required by chr-import-lint.sh to drive the
        # RouterOS first-boot password-change interactive dialog, which
        # plain sshpass cannot satisfy (sshpass(1) only fills the initial
        # SSH password prompt). `netcat-openbsd` provides `nc -z` for
        # the SSH-port readiness probe.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 sshpass unzip curl expect netcat-openbsd

      - name: Cache CHR image
        if: steps.filter.outputs.mikrotik == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: chr.img
          key: chr-${{ env.CHR_VERSION }}

      - name: Download CHR if not cached
        if: steps.filter.outputs.mikrotik == 'true'
        run: |
          if [ ! -f chr.img ]; then
            curl -fL "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" -o chr.zip
            unzip chr.zip
            mv "chr-${CHR_VERSION}.img" chr.img
          fi

      - name: Run CHR import lint
        if: steps.filter.outputs.mikrotik == 'true'
        run: bash .github/scripts/chr-import-lint.sh
        env:
          CHR_IMAGE: chr.img
          GOLDEN_RSC: pkg/mikrotik/testdata/deploy-golden.rsc

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.retag_version == ''
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          # Uses the `toolchain` directive in go.mod so vuln-patched Go ships
          # with the code. Bump go.mod (not this file) when the stdlib needs
          # to move.
          go-version-file: go.mod
          check-latest: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build Binaries
        run: CGO_ENABLED=1 go build -trimpath -o bin/awg-mesh-node ./cmd/awg-mesh-node && CGO_ENABLED=1 go build -trimpath -o bin/mesh-ctl ./cmd/mesh-ctl

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin
          path: bin/

  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.retag_version == ''
    runs-on: ubuntu-latest
    needs: [build]
    # Multi-arch images — one manifest list covers every platform the project
    # is expected to run on. Published for:
    #   linux/amd64    Intel/AMD servers, workstations, x86_64 laptops
    #   linux/386      legacy 32-bit x86 hosts (rare, but common in embedded)
    #   linux/arm64    Raspberry Pi 3B+/4/5, MikroTik hAP ax/ax3, modern SBCs
    #   linux/arm/v7   Raspberry Pi 2 and 3 (32-bit), older MikroTik, Orange Pi
    #   linux/arm/v6   Raspberry Pi Zero, Pi 1, ancient ARM hosts
    # Without this list, any non-amd64 hardware fails the pull with
    # "architecture mismatch" — see field report bug 13.
    strategy:
      matrix:
        include:
          - image: node
            dockerfile: deploy/Dockerfile.node
            platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6
          - image: client
            dockerfile: deploy/Dockerfile.client
            platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6
    permissions:
      contents: read
      packages: write
      # Required for SLSA provenance attestation signing (via buildx).
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute version string
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUM: ${{ github.event.number }}
        run: |
          set -euo pipefail
          SHORT=${SHA:0:8}
          if [[ "$REF_TYPE" == "tag" ]]; then
            VER="$REF_NAME"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            VER="pr-${PR_NUM}@${SHORT}"
          else
            VER="${REF_NAME}@${SHORT}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      # Build amd64-only first so the smoke test has a local image to exercise.
      # --load can only import a single platform; the multi-arch push below
      # reuses the buildx cache, so the total added cost is small.
      #
      # NOTE: no SBOM/provenance here — `--load` is incompatible with
      # attestations (buildkit limitation). Attestations are attached to
      # the push-to-registry builds below.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: awg-mesh-${{ matrix.image }}:ci
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke Test (node only)
        if: matrix.image == 'node'
        run: |
          docker run --rm --privileged --entrypoint sh awg-mesh-node:ci -c '
            echo test > /config/mesh.token &&
            timeout 5 /usr/local/bin/awg-mesh-node --mode endpoint --name ci-test --overlay-ip 10.0.0.99 2>&1 || true
          ' | tee /tmp/smoke.log
          # v1.12.2+: endpoint uses lazy per-master iface creation on AddPeer RPC instead of
          # creating a wg0 on startup. Accept either the new lazy marker or the legacy message
          # so the check remains backward-compatible if the endpoint ever runs in the old mode.
          grep -qE "endpoint_lazy_iface_mode|endpoint per-master iface created|endpoint interface created" /tmp/smoke.log \
            || (echo "::error::Smoke test failed — no endpoint iface signal (lazy or legacy)" && exit 1)
          grep -q "gRPC server listening" /tmp/smoke.log || (echo "::error::Smoke test failed — no gRPC server" && exit 1)
          echo "Smoke test passed"

      - name: Smoke Test (client only)
        if: matrix.image == 'client'
        run: |
          docker run --rm --privileged --entrypoint sh awg-mesh-client:ci -c '
            echo test > /config/mesh.token &&
            timeout 5 /usr/local/bin/awg-mesh-node --mode client --name ci-client --overlay-ip 10.0.0.200 2>&1 || true
          ' | tee /tmp/smoke-client.log
          grep -q "gRPC server listening" /tmp/smoke-client.log || (echo "::error::Client smoke test failed — no gRPC server" && exit 1)
          echo "Client smoke test passed"

      - name: Login to GHCR
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive tags for the primary image (awg-mesh-node / awg-mesh-client).
      # On main push: `latest` + full SHA.
      # On tag push (v1.8.0): `v1.8.0`, `1.8`, `1` (major suppressed for v0.x) + full SHA.
      - name: Compute primary image tags
        id: meta-primary
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/coonfuuseed-paandaa/awg-mesh-${{ matrix.image }}
            ${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # Attach SLSA provenance + SBOM attestations. `provenance: mode=max`
      # records full build-time metadata (source revision, build parameters,
      # materials) as a signed attestation. `sbom: true` generates and
      # attaches an SPDX SBOM. Downstream consumers can verify both via
      # `docker buildx imagetools inspect --format '{{ json .Provenance }}'`.
      - name: Build and Push (multi-arch)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta-primary.outputs.tags }}
          labels: ${{ steps.meta-primary.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Historical alias: some operators hard-coded ghcr.io/.../awg-mesh (no
      # -node suffix) before the multi-image split. Keep it working.
      # Alias is GHCR-only (not mirrored to Docker Hub).
      - name: Compute alias image tags (node only)
        id: meta-alias
        if: matrix.image == 'node' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/coonfuuseed-paandaa/awg-mesh
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and Push awg-mesh alias (node only)
        if: matrix.image == 'node' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta-alias.outputs.tags }}
          labels: ${{ steps.meta-alias.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Verify the published manifest list advertises every platform the
      # matrix declared. Catches silent regressions where a config change
      # drops an arch (the Bug 13 failure mode). Uses SHA tag (always
      # present regardless of ref — branch, tag, or both).
      #
      # Per AGENTS.md mandatory release tagging rule: every release tag MUST
      # publish to BOTH GHCR and Docker Hub. The verification iterates both
      # registries; any missing tag/platform fails the release and triggers
      # the retag workflow per AGENTS.md operator runbook.
      - name: Verify multi-arch manifest (GHCR + Docker Hub)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        run: |
          set -e
          for registry in \
              "ghcr.io/coonfuuseed-paandaa/awg-mesh-${{ matrix.image }}" \
              "${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh-${{ matrix.image }}"; do
            echo "::group::Verify ${registry}:${{ github.sha }}"
            MANIFEST=$(docker buildx imagetools inspect "${registry}:${{ github.sha }}")
            echo "$MANIFEST"
            for platform in linux/amd64 linux/386 linux/arm64 linux/arm/v7 linux/arm/v6; do
              echo "$MANIFEST" | grep -q "$platform" || \
                (echo "::error::${registry}: manifest missing $platform" && exit 1)
            done
            echo "::endgroup::"
          done

          # On tag push, verify the FULL alias set produced by
          # docker/metadata-action is reachable on both registries.
          # metadata-action emits the following tags for a vX.Y.Z push
          # (matches the patterns in steps.meta-primary / meta-alias):
          #   - vX.Y.Z          (type=semver,pattern=v{{version}})
          #   - X.Y.Z           (type=semver,pattern={{version}})
          #   - X.Y             (type=semver,pattern={{major}}.{{minor}})
          #   - X               (type=semver,pattern={{major}}, only when X != 0)
          #
          # Verifying only ${{ github.ref_name }} (== vX.Y.Z) misses
          # X.Y.Z, X.Y, and X — a partial-publish there still passes
          # this gate. Operators pinning to ":1.14" or ":1" would then
          # silently break on a partial publish. Catch every alias.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            REF_NAME="${{ github.ref_name }}"          # e.g. v1.14.0
            STRIPPED="${REF_NAME#v}"                    # e.g. 1.14.0
            MAJOR="${STRIPPED%%.*}"                     # 1
            REST="${STRIPPED#*.}"                       # 14.0
            MINOR="${REST%%.*}"                         # 14
            ALIASES=( "${REF_NAME}" "${STRIPPED}" "${MAJOR}.${MINOR}" )
            # metadata-action only publishes the major-only alias when
            # MAJOR != 0 (enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}).
            if [[ "${MAJOR}" != "0" ]]; then
              ALIASES+=( "${MAJOR}" )
            fi
            for registry in \
                "ghcr.io/coonfuuseed-paandaa/awg-mesh-${{ matrix.image }}" \
                "${{ secrets.DOCKERHUB_USERNAME }}/awg-mesh-${{ matrix.image }}"; do
              for alias in "${ALIASES[@]}"; do
                echo "::group::Verify alias ${registry}:${alias}"
                docker buildx imagetools inspect "${registry}:${alias}" >/dev/null \
                  || (echo "::error::${registry}: alias tag ${alias} missing" && exit 1)
                echo "::endgroup::"
              done
            done
          fi

  # Retroactively tag existing images without rebuilding. Uses
  # `buildx imagetools create --tag` which mutates the registry's tag
  # reference only — the manifest digest is preserved. Operators pulling
  # `:v1.8.0` and `:<source_sha>` get bit-identical images.
  #
  # Trigger: `gh workflow run build.yml -f retag_version=v1.8.0 -f source_sha=<long-sha>`.
  # Used to backfill semver tags for releases published before this workflow
  # supported `on.push.tags`.
  retag:
    if: github.event_name == 'workflow_dispatch' && inputs.retag_version != '' && inputs.source_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: awg-mesh-node
            mirror_dockerhub: true
          - image: awg-mesh-client
            mirror_dockerhub: true
          # Historical alias published to GHCR only.
          - image: awg-mesh
            mirror_dockerhub: false
    steps:
      # Input validation — reject malformed inputs BEFORE any auth step so
      # credentials never load for a bogus request. Defense-in-depth beyond
      # env-routing (Finding #1 of security review).
      #
      # Uses bash `[[ =~ ]]` (whole-string match) rather than `grep -qE`
      # because grep matches per-line: an input containing an embedded
      # `\n` where the first line matches the pattern would pass `grep`
      # while smuggling extra content into $VERSION/$SOURCE — later
      # interpolated into docker tag args and `git cat-file`. `[[ =~ ]]`
      # treats `$` as end-of-string, closing that bypass.
      # GitHub Actions Linux runners use `bash -e {0}` by default, so
      # `[[ =~ ]]` is available without extra shebang.
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.retag_version }}
          SOURCE: ${{ inputs.source_sha }}
        run: |
          set -e
          # SemVer 2.0 pre-release grammar: <ident>(.<ident>)*, where each
          # ident is [0-9A-Za-z-]+. Accepts e.g. v1.0.0-rc.1, v1.0.0-rc-1,
          # v1.0.0-alpha-build.2. Rejects v1.0.0-!junk.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::retag_version '$VERSION' must match v<major>.<minor>.<patch>[-prerelease] (SemVer 2.0)"
            exit 1
          fi
          if [[ ! "$SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha '$SOURCE' must be a 40-char lowercase hex commit SHA"
            exit 1
          fi
          echo "Inputs validated: version=$VERSION source=$SOURCE"

      # Full git history so we can verify source_sha is an actual commit
      # in THIS repo — not an arbitrary SHA that happens to exist in the
      # GHCR namespace. Closes the STRIDE Tampering finding: a compromised
      # packages:write scope could push a malicious image and retag it as
      # an official release without this gate.
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Verify source_sha is reachable from main
        env:
          SOURCE: ${{ inputs.source_sha }}
        run: |
          set -e
          # Existence check — SHA must exist in this repo's object graph
          # (rules out random SHAs from other repos or fabricated strings).
          if ! git cat-file -e "${SOURCE}^{commit}" 2>/dev/null; then
            echo "::error::source_sha '$SOURCE' is not a commit in this repository"
            exit 1
          fi
          # Reachability check — SHA must be an ancestor of main
          # (rules out short-lived feature branches or orphan commits that
          # exist in the object graph but aren't part of release history).
          # Only commits merged into main via PR are release-worthy.
          if ! git merge-base --is-ancestor "$SOURCE" origin/main; then
            echo "::error::source_sha '$SOURCE' is not an ancestor of origin/main — only merged commits can be retagged"
            exit 1
          fi
          COMMIT_INFO=$(git log -1 --format='%H %s' "$SOURCE")
          echo "source_sha verified as main-reachable commit: $COMMIT_INFO"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: matrix.mirror_dockerhub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Inputs reach shell bodies via env to prevent command injection —
      # `${{ inputs.x }}` is substituted before bash sees the line, which
      # would let a crafted input execute arbitrary commands in a runner
      # that has packages:write + DOCKERHUB_TOKEN. `workflow_dispatch`
      # requires write access so blast radius is limited, but the hardening
      # is free.
      #
      # Tag set matches the normal tag-push path: v<version>, <major>.<minor>,
      # <major> (suppressed for v0.x). Without the aliases, consumers pinning
      # :1.8 or :1 keep pulling stale digests after a retag.
      - name: Retag GHCR
        env:
          VERSION: ${{ inputs.retag_version }}
          SOURCE: ${{ inputs.source_sha }}
          IMAGE: ghcr.io/coonfuuseed-paandaa/${{ matrix.image }}
        run: |
          set -e
          SEMVER="${VERSION#v}"
          MAJOR="${SEMVER%%.*}"
          REST="${SEMVER#*.}"
          MINOR="${REST%%.*}"
          TAGS=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:$MAJOR.$MINOR")
          if [ "$MAJOR" != "0" ]; then
            TAGS+=(--tag "$IMAGE:$MAJOR")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:$SOURCE"

      # Docker Hub retag — only for primary images, not the GHCR-only alias.
      - name: Retag Docker Hub
        if: matrix.mirror_dockerhub
        env:
          VERSION: ${{ inputs.retag_version }}
          SOURCE: ${{ inputs.source_sha }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
        run: |
          set -e
          SEMVER="${VERSION#v}"
          MAJOR="${SEMVER%%.*}"
          REST="${SEMVER#*.}"
          MINOR="${REST%%.*}"
          TAGS=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:$MAJOR.$MINOR")
          if [ "$MAJOR" != "0" ]; then
            TAGS+=(--tag "$IMAGE:$MAJOR")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:$SOURCE"

      - name: Verify retagged manifest (GHCR)
        env:
          VERSION: ${{ inputs.retag_version }}
          IMAGE: ghcr.io/coonfuuseed-paandaa/${{ matrix.image }}
        run: |
          set -e
          MANIFEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION")
          echo "$MANIFEST"
          for platform in linux/amd64 linux/386 linux/arm64 linux/arm/v7 linux/arm/v6; do
            echo "$MANIFEST" | grep -q "$platform" || \
              (echo "::error::GHCR $IMAGE:$VERSION missing $platform" && exit 1)
          done

      # Docker Hub partial failures (auth scope regression, rate limit,
      # transient 5xx) otherwise surface during user `docker pull`. Verify
      # the mirror matches the GHCR manifest list coverage.
      - name: Verify retagged manifest (Docker Hub)
        if: matrix.mirror_dockerhub
        env:
          VERSION: ${{ inputs.retag_version }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
        run: |
          set -e
          MANIFEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION")
          echo "$MANIFEST"
          for platform in linux/amd64 linux/386 linux/arm64 linux/arm/v7 linux/arm/v6; do
            echo "$MANIFEST" | grep -q "$platform" || \
              (echo "::error::Docker Hub $IMAGE:$VERSION missing $platform" && exit 1)
          done
