services:
  awg-mesh-node:
    image: ghcr.io/coonfuuseed-paandaa/awg-mesh:latest
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      - MESH_TOKEN=749fd1c8d21836f858ddb8ff6603e432e4d506f4b7c28ba81296c3aa383bdeb1
      - MESH_MODE=endpoint
      - MESH_OVERLAY_IP=172.20.70.37
      - MESH_LISTEN_PORT=51820
    volumes:
      - /etc/awg-mesh:/etc/awg-mesh
      - /var/lib/awg-mesh:/var/lib/awg-mesh