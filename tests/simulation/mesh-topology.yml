# AWG Mesh Simulation Topology
# Uses localhost with mapped ports for mesh-ctl access from Windows host
# gRPC ports: master-01=19090, master-02=29090, node-asia-01=39090, node-asia-02=49090, node-asia-03=59090, node-eu-01=69090, node-us-01=79090
# AWG ports: mapped to 1x820 range

overlay:
  space: 172.20.70.0/24
  physical_mtu: 1500
  awg_overhead: 80
  ranges:
    - name: masters
      cidr: 172.20.70.0/27
      balancer_ip: 172.20.70.1
    - name: endpoints
      cidr: 172.20.70.32/27
      balancer_ip: 172.20.70.33
    - name: clients
      cidr: 172.20.70.128/25

masters:
  - name: master-01
    host: 127.0.0.1
    peer_host: 192.168.50.10
    overlay_ip: 172.20.70.2
    listen_port: 51820
    grpc_port: 19090
    endpoints:
      - node-asia-01
      - node-asia-02
      - node-asia-03
      - node-us-01
      - node-eu-01

  - name: master-02
    host: 127.0.0.1
    peer_host: 192.168.50.11
    overlay_ip: 172.20.70.3
    listen_port: 51820
    grpc_port: 29090
    endpoints:
      - node-asia-01
      - node-asia-02
      - node-asia-03
      - node-us-01
      - node-eu-01

endpoints:
  - name: node-asia-01
    host: 127.0.0.1
    peer_host: 192.168.50.20
    overlay_ip: 172.20.70.34
    listen_port: 51820
    grpc_port: 39090
    region: asia

  - name: node-asia-02
    host: 127.0.0.1
    peer_host: 192.168.50.21
    overlay_ip: 172.20.70.35
    listen_port: 51820
    grpc_port: 49090
    region: asia

  - name: node-asia-03
    host: 127.0.0.1
    peer_host: 192.168.50.22
    overlay_ip: 172.20.70.36
    listen_port: 51820
    grpc_port: 59090
    region: asia

  - name: node-eu-01
    host: 127.0.0.1
    peer_host: 192.168.50.30
    overlay_ip: 172.20.70.37
    listen_port: 51820
    grpc_port: 16090
    region: pl

  - name: node-us-01
    host: 127.0.0.1
    peer_host: 192.168.50.31
    overlay_ip: 172.20.70.38
    listen_port: 51820
    grpc_port: 17090
    region: americas

clients:
  - name: client-01
    type: linux
    host: 127.0.0.1
    overlay_ip: 172.20.70.131
    grpc_port: 18090
    masters:
      - master-01
      - master-02

capture:
  domains_file: domains.txt
  schedule: "24h"
  retention_days: 30

rotation:
  defaults:
    tier1_interval: 24h
    tier2_interval: 168h
    tier3_interval: 720h
    preset: aggressive

transport:
  pool: 10.255.0.0/16
  prefix_length: 30
