      - ./mesh-topology.yml:/config/mesh-topology.yml:ro
    networks:
      mesh-sim:
        ipv4_address: 192.168.50.11
    ports:
      - "29090:9090"
      - "29091:9091"
      - "21820:51820/udp"
    entrypoint: ["sh", "-c", "[ -f /config/mesh.token ] || echo test-hash > /config/mesh.token; exec /usr/local/bin/awg-mesh-node --mode master --name ru-02 --overlay-ip 172.20.70.3 --listen-port 51820 --topology /config/mesh-topology.yml"]

