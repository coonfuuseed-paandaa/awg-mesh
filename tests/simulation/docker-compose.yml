# AWG Mesh Full Simulation
# 2 masters + 5 endpoints, all with gRPC port mapping for mesh-ctl access

services:
  master-01:
    image: awg-mesh-node:transport
    container_name: master-01
    hostname: master-01
    restart: unless-stopped
    privileged: true
    volumes:
      - master-01-config:/config
      - ./mesh-topology.yml:/config/mesh-topology.yml:ro
    networks:
      mesh-sim:
        ipv4_address: 192.168.50.10
    ports:
      - "19090:9090"
      - "19091:9091"
      - "11820:51820/udp"
    entrypoint: ["sh", "-c", "[ -f /config/mesh.token ] || echo test-hash > /config/mesh.token; exec /usr/local/bin/awg-mesh-node --mode master --name master-01 --overlay-ip 172.20.70.2 --listen-port 51820 --topology /config/mesh-topology.yml"]

  master-02:
    image: awg-mesh-node:transport
    container_name: master-02
    hostname: master-02
    restart: unless-stopped
