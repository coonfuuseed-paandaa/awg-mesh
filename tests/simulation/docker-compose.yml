    restart: unless-stopped
    privileged: true
    volumes:
      - kz-01-config:/config
      - ./mesh-topology.yml:/config/mesh-topology.yml:ro
    networks:
      mesh-sim:
        ipv4_address: 192.168.50.20
    ports:
      - "39090:9090"
      - "31820:51820/udp"
