      - "41820:51820/udp"
    entrypoint: ["sh", "-c", "[ -f /config/mesh.token ] || echo test-hash > /config/mesh.token; exec /usr/local/bin/awg-mesh-node --mode endpoint --name kz-02 --overlay-ip 172.20.70.35 --listen-port 51820 --topology /config/mesh-topology.yml"]

  kz-03:
    image: awg-mesh-node:transport
