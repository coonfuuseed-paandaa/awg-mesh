networks:
  mesh-sim:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.50.0/24

volumes:
  ru-01-config:
  ru-02-config:
  kz-01-config:
  kz-02-config:
  kz-03-config:
  pl-01-config:
  us-01-config:
  client-01-config:
