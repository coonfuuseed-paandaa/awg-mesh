overlay:
  space: 172.20.70.0/24
  physical_mtu: 1500
  awg_overhead: 80
  ranges:
    - name: masters
      cidr: 172.20.70.0/27
      balancer_ip: 172.20.70.1
    - name: endpoints
      cidr: 172.20.70.32/27
      balancer_ip: 172.20.70.33
    - name: clients
      cidr: 172.20.70.128/25

masters:
  - name: master-01
    host: 198.51.100.10
    overlay_ip: 172.20.70.2
    listen_port: 51820
    endpoints:
      - node-asia-01
      - node-asia-02
      - node-eu-01
  - name: master-02
    host: 198.51.100.11
    overlay_ip: 172.20.70.3
    listen_port: 51820
    endpoints:
      - node-asia-03
      - node-eu-01

endpoints:
  - name: node-asia-01
    host: 203.0.113.10
    overlay_ip: 172.20.70.34
    listen_port: 51820
    region: asia
  - name: node-asia-02
    host: 203.0.113.11
    overlay_ip: 172.20.70.35
    listen_port: 51820
    region: asia
  - name: node-asia-03
    host: 203.0.113.12
    overlay_ip: 172.20.70.36
    listen_port: 51820
    region: asia
  - name: node-eu-01
    host: 91.200.50.100
    overlay_ip: 172.20.70.37
    listen_port: 51820
    region: pl

clients:
  - name: office-linux
    type: linux
    overlay_ip: 172.20.70.130
    masters:
      - master-01
      - master-02
  - name: my-router
    type: mikrotik
    overlay_ip: 172.20.70.131
    masters:
      - master-01

capture:
  domains_file: domains.txt   # local file on admin PC, distributed to masters via gRPC
  schedule: "0 3 * * *"
  retention_days: 30

rotation:
  defaults:
    tier1_interval: 24h
    tier2_interval: 168h
    tier3_interval: 720h
    preset: aggressive

transport:
  pool: 10.255.0.0/16
  prefix_length: 30
