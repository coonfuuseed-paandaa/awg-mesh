sonar.projectKey=coonfuuseed_paandaa_awg_mesh
sonar.projectName=awg-mesh
sonar.sourceEncoding=UTF-8

# Maintained Go code and its colocated unit tests.
sonar.sources=go.mod,cmd,pkg
sonar.tests=cmd,pkg
sonar.exclusions=**/*_test.go,**/*.pb.go,**/*_grpc.pb.go,proto/**,vendor/**,bin/**,dist/**,deploy/**,tests/**,.agent/**,.claude/**,.codex/**,.omp/**,**/testdata/**,**/*.key,**/*.pem,keys/**,.mesh-ctl-e2e/**
